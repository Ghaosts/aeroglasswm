# AeroglassWM Configuration

[general]
layout = "desktop"
workspaces = 9
refresh_rate = 165
xkb_layout = "us,ru"
xkb_options = "grp:alt_shift_toggle,grp:win_space_toggle"

autostart = [
  "swaybg -i ~/Изображения/Linux.png -m fill",
  "waybar",
  "mako",
  "wl-paste --watch cliphist store"
]

[grid]
gap = 10
gap_between = 20
max_windows = 6
preset = 3
vertical = 0
lock = false
hud_mode = "miniature"
hud_radius = -1

[decoration]
theme = "dark"
corner_radius = 12
border_width = 2
anim_duration = 160
blur = true
blur_size = 6
blur_passes = 2
blur_layers = false
shadow = true
shadow_range = 18
active_opacity = 1.0
inactive_opacity = 0.94

[decoration.colors]
bg = "#14161ef2"
border_active = "#ffffffff"
border_inactive = "#60657880"

[slider]
enabled = true
slider_w = 200
slider_h = 20
bar_h = 30
slider_radius = 10
btn_radius = 8
bar_radius = 12

[hotkeys]
"Super+Return" = "exec:foot"
"Super+d" = "exec:rofi -show drun"
"Super+e" = "exec:dolphin"
"Super+b" = "exec:firefox"
"Super+q" = "close"
"Super+f" = "fullscreen"
"Super+v" = "win_floating"
"Super+c" = "win_center"
"Super+r" = "grid_flip"
"Super+Shift+r" = "exec:~/.local/bin/aeroglass-reload"
"Super+Left" = "focus_left"
"Super+Right" = "focus_right"
"Super+Up" = "focus_up"
"Super+Down" = "focus_down"
"Super+Shift+Left" = "swap_left"
"Super+Shift+Right" = "swap_right"
"Super+Shift+Up" = "swap_up"
"Super+Shift+Down" = "swap_down"
"Super+1" = "ws_1"
"Super+2" = "ws_2"
"Super+3" = "ws_3"
"Super+4" = "ws_4"
"Super+5" = "ws_5"
"Super+6" = "ws_6"
"Super+7" = "ws_7"
"Super+8" = "ws_8"
"Super+9" = "ws_9"
"Super+Shift+1" = "move_ws_1"
"Super+Shift+2" = "move_ws_2"
"Super+Shift+3" = "move_ws_3"
"Super+Shift+4" = "move_ws_4"
"Super+Shift+5" = "move_ws_5"
"Super+Shift+6" = "move_ws_6"
"Super+Shift+7" = "move_ws_7"
"Super+Shift+8" = "move_ws_8"
"Super+Shift+9" = "move_ws_9"
"Print" = "exec:~/.local/bin/ag-screenshot"
"Super+Shift+s" = "exec:mkdir -p ~/Pictures && slurp | grim -g - ~/Pictures/shot_area.png"

[[windowrule]]
title = "Picture-in-Picture"
float = true
pin = true
