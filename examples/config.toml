xkb_layout = "us,ru"
xkb_options = "grp:alt_shift_toggle,grp:win_space_toggle"
# Основные отступы и геометрия
terminal = "foot"
layout = "desktop"
gap = 10
gap_x = 20
gap_y = 20
gap_between = 20
border_width = 2
corner_radius = 12
anim_duration = 240

# Верхняя панель и слайдер
slider_w = 200
slider_h = 20
bar_h = 30
slider_radius = 10
btn_radius = 8
bar_radius = 12
morph_radius = 100

# Настройки HUD сетки
hud_mode = "miniature"
hud_radius = -1

autostart = [
  "swaybg -i /usr/share/wallpapers/cachyos-wallpapers/Abstract.png -m fill",
  "waybar",
  "mako",
  "wl-paste --watch cliphist store",
]

[colors]
bg = [0.95, 0.95, 0.95, 1.0]
bar = [0.05, 0.05, 0.05, 0.95]
slider = [0.3, 0.3, 0.3, 0.95]
btn_fs = [0.2, 0.6, 1.0, 0.9]
btn_close = [1.0, 0.3, 0.3, 0.9]
border_active = [1.0, 1.0, 1.0, 0.95]
border_inactive = [0.35, 0.35, 0.38, 0.45]

[actions]
click_left = "fullscreen"
click_right = "close"
swipe_left = "fullscreen"
swipe_right = "close"
swipe_up = "detach"

[images]
bar = "~/.config/aeroglass/skins/qa_test/bar.png"
slider = "~/.config/aeroglass/skins/qa_test/slider.png"
btn_left = "~/.config/aeroglass/skins/qa_test/left.png"
btn_right = "~/.config/aeroglass/skins/qa_test/right.png"

[hotkeys]
"Print" = "exec:mkdir -p ~/Pictures && slurp | grim -g - ~/Pictures/shot_area.png"
"Super+Shift+s" = "exec:mkdir -p ~/Pictures && slurp | grim -g - ~/Pictures/shot_area.png"
"Super+Shift+r" = "exec:~/.local/bin/aeroglass-reload"
# Запуск приложений
"Super+Return" = "exec:foot"
"Super+d" = "exec:rofi -show drun"

# Управление окнами
"Super+q" = "close"
"Super+v" = "win_floating"
"Super+f" = "ws_floating"

# Управление сеткой и стеком
"Super+r" = "grid_flip"
"Super+bracketright" = "stack_next"
"Super+bracketleft" = "stack_prev"

# Перемещение и фокус
"Super+Shift+Left" = "swap_left"
"Super+Shift+Right" = "swap_right"
"Super+Shift+Up" = "swap_up"
"Super+Shift+Down" = "swap_down"
"Super+Up" = "focus_up"
"Super+Down" = "focus_down"

"Super+Shift+Cyrillic_yeru" = "exec:mkdir -p ~/Pictures && slurp | grim -g - ~/Pictures/shot_area.png"
"Super+e" = "exec:dolphin"
"Super+Cyrillic_u" = "exec:dolphin"
"Super+b" = "exec:MOZ_ENABLE_WAYLAND=1 firefox"
"Super+Cyrillic_i" = "exec:MOZ_ENABLE_WAYLAND=1 firefox"
"Super+m" = "fullscreen"
"Super+Shift+e" = "exec:pkill -TERM aeroglasswm"
"Super+1" = "ws_1"
"Super+2" = "ws_2"
"Super+3" = "ws_3"
"Super+4" = "ws_4"
"Super+5" = "ws_5"
"Super+6" = "ws_6"
"Super+7" = "ws_7"
"Super+8" = "ws_8"
"Super+9" = "ws_9"
"Super+Shift+1" = "move_ws_1"
"Super+Shift+2" = "move_ws_2"
"Super+Shift+3" = "move_ws_3"
"Super+Shift+4" = "move_ws_4"
"Super+Shift+5" = "move_ws_5"
"Super+Shift+6" = "move_ws_6"
"Super+Shift+7" = "move_ws_7"
"Super+Shift+8" = "move_ws_8"
"Super+Shift+9" = "move_ws_9"

"XF86AudioRaiseVolume" = "exec:wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "exec:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = "exec:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86MonBrightnessUp" = "exec:brightnessctl set 5%+"
"XF86MonBrightnessDown" = "exec:brightnessctl set 5%-"
"Super+c" = "win_center"

"Super+Left" = "focus_left"
"Super+Right" = "focus_right"
